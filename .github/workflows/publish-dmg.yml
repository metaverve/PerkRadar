name: Publish macOS downloads
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43880782531
          path: downloads
          merge-multiple: true
      - name: Upload verified DMGs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload desktop-v0.2.0 downloads/*.dmg downloads/*.sha256 --clobber
          gh release edit desktop-v0.2.0 --draft=false
