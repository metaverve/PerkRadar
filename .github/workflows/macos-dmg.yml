name: Build macOS DMG

on:
  push:
    branches: [main]
    paths:
      - desktop/**
      - scripts/build-dmg.sh
      - .github/workflows/macos-dmg.yml
      - next.config.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Build app and disk image
        run: bash scripts/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PerkRadar-dmg-${{ runner.arch }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
